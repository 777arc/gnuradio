id: rds_tag_to_msg
label: Latency Tag to Message
category: '[RDS]'
flags: [python, cpp]

templates:
  imports: import rds
  make: rds.tag_to_msg(${type.size}*${vlen})

cpp_templates:
  includes: ['#include <rds/tag_to_msg.h>']
  declarations: 'rds::tag_to_msg::sptr ${id};'
  make: 'this->${id} = rds::tag_to_msg::make(${type.size}*${vlen});'
  link: ['gnuradio-rds']

parameters:
-   id: type
    label: Input Type
    dtype: enum
    options: [complex, float, int, short, byte]
    option_attributes:
        size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short,
            gr.sizeof_char]
    hide: part
-   id: num_inputs
    label: Num Inputs
    dtype: int
    default: '1'
    hide: part
-   id: vlen
    label: Vec Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }

inputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }
    multiplicity: ${ num_inputs }

outputs:
-   domain: message
    id: strobe 
    optional: false 

asserts:
- ${ num_inputs >= 1 }
- ${ vlen > 0 }

file_format: 1

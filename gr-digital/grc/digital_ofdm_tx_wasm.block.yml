id: digital_ofdm_tx_wasm
label: OFDM Transmitter Wasm
flags: [ python ]

# A drop-in twin of "OFDM Transmitter" (digital_ofdm_tx) for the WebAssembly
# runner. The stock block is a Python gr.hier_block2, which the browser build
# cannot instantiate (no Python); this definition has the same parameters,
# ports and behaviour, and is backed by a hand-written C++ hier_block2 in
# wasm/runner/src/registry.cpp. On the desktop it generates exactly the same
# digital.ofdm_tx() call as the original block.

parameters:
-   id: fft_len
    label: FFT Length
    dtype: int
    default: '64'
-   id: cp_len
    label: Cyclic Prefix Length
    dtype: int
    default: '16'
-   id: packet_len_key
    label: Length Tag Name
    dtype: string
    default: length
-   id: occupied_carriers
    label: Occupied Carriers
    dtype: raw
    default: ()
    hide: ${ 'none' if occupied_carriers else 'part' }
-   id: pilot_carriers
    label: Pilot Carriers
    dtype: raw
    default: ()
    hide: ${ 'none' if pilot_carriers else 'part' }
-   id: pilot_symbols
    label: Pilot Symbols
    dtype: raw
    default: ()
    hide: ${ 'none' if pilot_symbols else 'part' }
-   id: sync_word1
    label: Sync Word 1
    dtype: raw
    default: ()
    hide: ${ 'none' if sync_word1 else 'part' }
-   id: sync_word2
    label: Sync Word 2
    dtype: raw
    default: ()
    hide: ${ 'none' if sync_word2 else 'part' }
-   id: header_mod
    label: Header Modulation
    dtype: enum
    options: ['"BPSK"', '"QPSK"']
    option_labels: [BPSK, QPSK]
    option_attributes:
        bps: ['1', '2']
-   id: payload_mod
    label: Payload Modulation
    dtype: enum
    options: ['"BPSK"', '"QPSK"', '"8-PSK"']
    option_labels: [BPSK, QPSK, 8-PSK]
    option_attributes:
        bps: ['1', '2', '3']
-   id: rolloff
    label: Rolloff length (samples)
    dtype: int
    default: '0'
-   id: scramble_bits
    label: Scramble Bits
    dtype: enum
    default: 'False'
    options: ['False', 'True']
    option_labels: ['No', 'Yes']
    hide: ${ ('part' if scramble_bits else 'none') }
-   id: log
    label: Log Debug Info
    dtype: enum
    default: 'False'
    options: ['False', 'True']
    option_labels: ['No', 'Yes']
    hide: ${ ('none' if log else 'part') }

inputs:
-   domain: stream
    dtype: byte

outputs:
-   domain: stream
    dtype: complex

asserts:
- ${ fft_len > 0 }
- ${ cp_len > 0 }
- ${ cp_len < fft_len }
- ${ rolloff >= 0 }

templates:
    imports: from gnuradio import digital
    make: |-
        digital.ofdm_tx(
            fft_len=${fft_len},
            cp_len=${cp_len},
            packet_length_tag_key=${packet_len_key},
            % if occupied_carriers:
            occupied_carriers=${occupied_carriers},
            % endif
            % if pilot_carriers:
            pilot_carriers=${pilot_carriers},
            % endif
            % if pilot_carriers:
            pilot_symbols=${pilot_symbols},
            % endif
            % if sync_word1:
            sync_word1=${sync_word1},
            % endif
            % if sync_word2:
            sync_word2=${sync_word2},
            % endif
            bps_header=${header_mod.bps},
            bps_payload=${payload_mod.bps},
            rolloff=${rolloff},
            debug_log=${log},
            scramble_bits=${scramble_bits})

documentation: |-
    Identical to the OFDM Transmitter block, but implemented in C++ so it also
    runs in the WebAssembly (browser) runner, where Python hierarchical blocks
    are unavailable.

    Leaving Occupied Carriers, Pilot Carriers, Pilot Symbols or the sync words
    empty selects the same 802.11a-style defaults the Python block uses, with
    the sync words generated from the same seeded random sequence, so the
    output is bit-compatible with digital.ofdm_tx.

    Log Debug Info is accepted for compatibility but has no effect in the
    browser runner (it writes debug files on desktop).

file_format: 1

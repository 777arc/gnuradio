name: Build WASM from source (cached)

# Proving ground for retiring the deps-vX release artifact.
#
# deploy-wasm.yml downloads a prebuilt tarball (sysroot + GNU Radio libs +
# qtgui) from a GitHub release, which has to be repacked by hand whenever the
# GR C++ changes -- and silently links stale libraries when someone forgets.
# This workflow instead builds everything from source and leans on two caches:
#
#   sysroot  cached as an OUTPUT, keyed on the dep scripts + toolchain versions.
#            It only changes when a dependency version or build recipe changes,
#            so it is a cache hit on essentially every run (~25 min on a miss).
#   ccache   GNU Radio, qtgui and the runner are compiled from source EVERY run,
#            with ccache absorbing the cost. Caching the gr build directory
#            instead would not work: actions/checkout gives every source file a
#            fresh mtime, so ninja would rebuild all 514 objects anyway. ccache
#            keys on preprocessed content, so a one-file GR change recompiles
#            one file. Nothing can go stale, because nothing is prebuilt.
#
# Manual only, and it does NOT deploy unless asked -- it uploads the assembled
# site as an artifact so a cold run and a warm run can both be inspected before
# this path replaces the release download in deploy-wasm.yml.
on:
  workflow_dispatch:
    inputs:
      rebuild_sysroot:
        description: "Ignore the sysroot cache and rebuild the deps from source (tests the cold path)"
        type: boolean
        default: false
      deploy:
        description: "Deploy the result to Cloudflare Pages (production)"
        type: boolean
        default: false

concurrency:
  group: build-wasm-from-source
  cancel-in-progress: true

env:
  EMSDK_VERSION: "3.1.70"
  QT_VERSION: "6.9.1"

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold run builds Boost/FFTW/GMP/Qwt/VOLK plus all of GNU Radio on 4 cores.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          # m4 is required by GMP's configure; ccache backs the from-source builds.
          sudo apt-get update && sudo apt-get install -y ninja-build ccache m4
          pip install mako pyyaml packaging aqtinstall

      # --- Emscripten toolchain (pinned, cached) ---
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          if [ ! -d ~/emsdk ]; then git clone https://github.com/emscripten-core/emsdk ~/emsdk; fi
          ~/emsdk/emsdk install ${EMSDK_VERSION}
          ~/emsdk/emsdk activate ${EMSDK_VERSION}

      # --- Qt 6 for wasm + host tools (cached) ---
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-${{ env.QT_VERSION }}
      - name: Install Qt (host + wasm)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          aqt install-qt linux desktop ${QT_VERSION} linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"
          aqt install-qt all_os wasm ${QT_VERSION} wasm_multithread -O "$GITHUB_WORKSPACE/Qt"

      # --- sysroot: Boost/FFTW/GMP/Qwt/VOLK/spdlog, cached as an output --------
      # Keyed on the scripts that define it (versions live in fetch-deps.sh) plus
      # the toolchain versions its objects must stay ABI-compatible with.
      - name: Restore sysroot cache
        id: cache-sysroot
        if: ${{ !inputs.rebuild_sysroot }}
        uses: actions/cache/restore@v4
        with:
          path: wasm/sysroot
          key: wasm-sysroot-emsdk${{ env.EMSDK_VERSION }}-qt${{ env.QT_VERSION }}-${{ hashFiles('wasm/deps/env.sh', 'wasm/deps/fetch-deps.sh', 'wasm/deps/build-deps.sh') }}

      - name: Build dependency sysroot
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: |
          source ~/emsdk/emsdk_env.sh
          export QT_HOST="$GITHUB_WORKSPACE/Qt/${QT_VERSION}/gcc_64"
          export QT_WASM="$GITHUB_WORKSPACE/Qt/${QT_VERSION}/wasm_multithread"
          bash wasm/deps/fetch-deps.sh
          bash wasm/deps/build-deps.sh

      - name: Save sysroot cache
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wasm/sysroot
          key: wasm-sysroot-emsdk${{ env.EMSDK_VERSION }}-qt${{ env.QT_VERSION }}-${{ hashFiles('wasm/deps/env.sh', 'wasm/deps/fetch-deps.sh', 'wasm/deps/build-deps.sh') }}

      # --- ccache: restored loosely so any recent run seeds the new one --------
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: wasm-ccache-${{ github.sha }}
          restore-keys: |
            wasm-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      # --- GNU Radio C++ from source (the part the release artifact used to hide)
      - name: Build GNU Radio
        run: |
          source ~/emsdk/emsdk_env.sh
          export SYSROOT="$GITHUB_WORKSPACE/wasm/sysroot"
          # -fexceptions keeps GR's own try/catch alive under Emscripten: without
          # it the landing pads are dropped and an exception thrown from a block's
          # work() kills the worker instead of being caught and logged.
          emcmake cmake -S "$GITHUB_WORKSPACE" -B wasm/gr/build-gr -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-pthread -fPIC -fexceptions" -DCMAKE_C_FLAGS="-pthread -fPIC" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPYTHON_EXECUTABLE="$(command -v python3)" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" -DCMAKE_PREFIX_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DENABLE_DEFAULT=OFF -DENABLE_PYTHON=OFF -DENABLE_GR_QTGUI=OFF -DENABLE_GR_AUDIO=OFF \
            -DENABLE_GR_ANALOG=ON -DENABLE_GR_BLOCKS=ON -DENABLE_GR_DIGITAL=ON \
            -DENABLE_GR_FFT=ON -DENABLE_GR_FILTER=ON -DENABLE_GR_FEC=ON -DENABLE_GR_DTV=ON \
            -DENABLE_GR_NETWORK=ON -DENABLE_GR_PDU=ON -DENABLE_GR_VOCODER=ON \
            -DTRY_SHM_VMCIRCBUF=OFF -DCMAKE_DISABLE_FIND_PACKAGE_libunwind=ON
          cmake --build wasm/gr/build-gr

      # --- qtgui, runner and editor (unchanged from deploy-wasm.yml) -----------
      - name: Build qtgui + runner + editor
        run: |
          source ~/emsdk/emsdk_env.sh
          export GR="$GITHUB_WORKSPACE"
          export QT_HOST="$GITHUB_WORKSPACE/Qt/${QT_VERSION}/gcc_64"
          export QT_WASM="$GITHUB_WORKSPACE/Qt/${QT_VERSION}/wasm_multithread"

          python3 wasm/runner/gen_registry.py
          python3 wasm/editor/gen/gen_blocklib.py wasm/editor/public/blocks.json

          (cd wasm/qtgui && "$QT_WASM/bin/qt-cmake" -S . -B build -GNinja \
             -DQT_HOST_PATH="$QT_HOST" -DCMAKE_CXX_FLAGS="-pthread -fPIC" \
             -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
             && cmake --build build)

          (cd wasm/runner && "$QT_WASM/bin/qt-cmake" -S . -B build -GNinja \
             -DQT_HOST_PATH="$QT_HOST" -DCMAKE_BUILD_TYPE=Release \
             -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
             && cmake --build build)

          (cd wasm/editor && npm ci && npm run build)

      - name: ccache stats
        run: ccache --show-stats

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: wasm-ccache-${{ github.sha }}

      # --- Assemble the site; publish as an artifact instead of deploying ------
      - name: Assemble site
        env:
          RECORDINGS_R2_BASE: ${{ vars.RECORDINGS_R2_BASE }}
        run: node wasm/scripts/assemble-site.mjs ./site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-site
          path: site
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        if: ${{ inputs.deploy }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./site --project-name=gnuradio-wasm --branch=main

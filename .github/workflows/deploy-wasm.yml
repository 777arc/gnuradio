name: Deploy WASM

# Build runner.wasm + the editor in CI and deploy the WASM app to Cloudflare
# Pages on every merge to main. Heavy prebuilt deps (sysroot + gnuradio libs +
# qtgui) are downloaded as a release artifact rather than rebuilt -- see
# wasm/docs/cloudflare-deploy-plan.md and wasm/scripts/pack-deps.sh.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-wasm
  cancel-in-progress: true

env:
  EMSDK_VERSION: "3.1.70"
  QT_VERSION: "6.9.1"
  DEPS_TAG: "deps-v1"          # bump when you re-publish the prebuilt deps tarball

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build zstd
          pip install mako pyyaml aqtinstall

      # --- Emscripten toolchain (pinned, cached) ---
      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          if [ ! -d ~/emsdk ]; then git clone https://github.com/emscripten-core/emsdk ~/emsdk; fi
          ~/emsdk/emsdk install ${EMSDK_VERSION}
          ~/emsdk/emsdk activate ${EMSDK_VERSION}

      # --- Qt 6 for wasm + host tools (cached) ---
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-${{ env.QT_VERSION }}
      - name: Install Qt (host + wasm)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          aqt install-qt linux desktop ${QT_VERSION} linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"
          aqt install-qt all_os wasm ${QT_VERSION} wasm_multithread -O "$GITHUB_WORKSPACE/Qt"

      # --- Prebuilt deps: sysroot + gr libs + qtgui (downloaded, not built) ---
      - name: Fetch prebuilt deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${DEPS_TAG}" -p 'wasm-deps.tar.zst' -O /tmp/wasm-deps.tar.zst
          tar --use-compress-program=unzstd -xf /tmp/wasm-deps.tar.zst -C wasm/

      # --- Build runner.wasm (+ side modules) and the editor (every push) ---
      - name: Build runner + editor
        run: |
          source ~/emsdk/emsdk_env.sh
          export GR="$GITHUB_WORKSPACE"
          export QT_HOST="$GITHUB_WORKSPACE/Qt/${QT_VERSION}/gcc_64"
          export QT_WASM="$GITHUB_WORKSPACE/Qt/${QT_VERSION}/wasm_multithread"

          python3 wasm/runner/gen_registry.py
          python3 wasm/editor/gen/gen_blocklib.py wasm/editor/public/blocks.json

          (cd wasm/runner && "$QT_WASM/bin/qt-cmake" -S . -B build -GNinja \
             -DQT_HOST_PATH="$QT_HOST" -DCMAKE_BUILD_TYPE=Release && cmake --build build)

          (cd wasm/editor && npm ci && npm run build)

      # --- Assemble the static site and deploy ---
      - name: Assemble site
        env:
          # Public base URL of the R2 bucket holding oversized recordings.
          # Set as a repo variable (Settings > Secrets and variables > Actions >
          # Variables). If empty, oversized recordings are omitted.
          RECORDINGS_R2_BASE: ${{ vars.RECORDINGS_R2_BASE }}
        run: node wasm/scripts/assemble-site.mjs ./site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./site --project-name=gnuradio-wasm --branch=main
